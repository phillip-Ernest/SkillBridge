{% extends "base.html" %}

{% block title %}Register | SkillBridge{% endblock %}

{% block content %}

<div class="form-container">

    <h2>Create Your SkillBridge Account</h2>

    <p>Join our platform and connect your skills with opportunities.</p>

    <form method="POST" action="{{ url_for('register') }}">

        <label>Full Name</label>
        <input type="text" name="full_name" placeholder="Enter your full name" required>

        <label>Email Address</label>
        <input type="email" name="email" placeholder="Enter your email" required>

        <label>Password</label>
        <input type="password" name="password" placeholder="Create a password" required>

        <label>Country of Origin</label>
        <input type="text" name="country" placeholder="Enter your country of origin" required>

        <label>Current Location</label>
        <input type="text" name="location" placeholder="Enter your current location" required>

        <label>Professional Field</label>
        <select name="professional_field" required>
            <option value="">Select your professional field</option>
            <option value="Information Technology">Information Technology</option>
            <option value="Healthcare">Healthcare</option>
            <option value="Education">Education</option>
            <option value="Engineering">Engineering</option>
            <option value="Business">Business</option>
            <option value="Agriculture">Agriculture</option>
            <option value="Other">Other</option>
        </select>

        <label>Highest Qualification</label>
        <select name="qualification" required>
            <option value="">Select qualification</option>
            <option value="Certificate">Certificate</option>
            <option value="Diploma">Diploma</option>
            <option value="Bachelor's Degree">Bachelor's Degree</option>
            <option value="Master's Degree">Master's Degree</option>
            <option value="PhD">PhD</option>
            <option value="Other">Other</option>
        </select>

        <button type="submit" class="btn">Create Account</button>

    </form>

    <p>
        Already registered?
        <a href="{{ url_for('login') }}">Login here</a>
    </p>

</div>

{% endblock %}
